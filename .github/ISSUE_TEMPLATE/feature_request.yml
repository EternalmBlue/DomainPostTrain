name: Feature request
description: Suggest a focused improvement to the post-training pipeline.
title: "[Feature]: "
labels: ["enhancement"]
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What workflow is blocked or awkward today?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed solution
      description: Describe the smallest useful change.
    validations:
      required: true
  - type: dropdown
    id: area
    attributes:
      label: Area
      options:
        - Data format
        - Training
        - Evaluation
        - Inference
        - Export
        - Documentation
        - Developer experience
        - Other
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
      description: What workaround or alternative did you consider?
  - type: checkboxes
    id: checks
    attributes:
      label: Pre-submit checks
      options:
        - label: This request is domain-neutral and does not depend on private or proprietary data.
          required: true
        - label: I searched existing issues and discussions first.
          required: true
