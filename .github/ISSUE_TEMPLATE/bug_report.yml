name: Bug report
description: Report a reproducible bug in the pipeline, scripts, or service.
title: "[Bug]: "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for reporting a bug. Please include enough detail for maintainers to reproduce it without private data.
  - type: textarea
    id: summary
    attributes:
      label: Summary
      description: What happened, and what did you expect instead?
    validations:
      required: true
  - type: dropdown
    id: area
    attributes:
      label: Area
      options:
        - CPT data preparation
        - Fact-SFT
        - DPO
        - Merge
        - Quality evaluation
        - Inference service
        - GGUF export
        - ONNX export
        - Documentation
        - Other
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Reproduction steps
      description: Provide commands, config snippets, and the smallest data shape that reproduces the issue.
      placeholder: |
        1. Run ...
        2. Observe ...
    validations:
      required: true
  - type: textarea
    id: environment
    attributes:
      label: Environment
      description: OS, Python version, CUDA version, GPU, and relevant package versions.
      placeholder: |
        OS:
        Python:
        CUDA:
        GPU:
        torch:
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Logs or error output
      description: Paste the relevant error. Remove secrets, private paths, customer data, and tokens.
      render: text
  - type: checkboxes
    id: checks
    attributes:
      label: Pre-submit checks
      options:
        - label: I removed credentials, private documents, customer data, and private paths from this issue.
          required: true
        - label: I searched existing issues and discussions first.
          required: true
