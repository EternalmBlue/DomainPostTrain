title: "[Show and tell] "
body:
  - type: markdown
    attributes:
      value: |
        Share safe experiments, training reports, adapted configs, export results, or demos. Do not include private corpora.
  - type: textarea
    id: project
    attributes:
      label: What did you build or test?
    validations:
      required: true
  - type: textarea
    id: setup
    attributes:
      label: Setup
      description: Base model, hardware, training stages, export target, and safe config notes.
  - type: textarea
    id: results
    attributes:
      label: Results
      description: What worked, what failed, and what you learned.
